<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width" />

  <script type="text/javascript" charset="UTF-8" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js">
  </script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>

  <style>
    body {
      font-family: sans-serif;
    }
  </style>

  <title>sketchCurve</title>
</head>

<body>

  <h1>Sketch</h1>
  <table style="width: 100%">
    <tr>
      <td align="center">
        <div id="jxgbox" class="jxgbox construct" style="width: 500px;height: 500px;margin:0 auto;"></div>
      </td>
    </tr>
  </table>

</body>

<script>
  "use strict";

  JXG.Options.text.useMathJax = true;

  var board = JXG.board('jxgbox', {
    boundingbox: [-2, 2, 2, -2],
    keepaspectratio: false,
    axis: true,
    defaultAxes: {
      x: {
        withLabel: false,
        ticks: false
      },
      y: {
        withLabel: false,
        ticks: false
      }
    },
    grid: false,
    pan: {
      enabled: false,       // needed in 3d to turn objects
      needTwoFingers: true, // panning is done with two fingers on touch devices
      needShift: true // mouse panning needs pressing of the shift key
    },
    //                browserPan: false,
    zoom: {
      enabled: true
    },
    sketches: {
      enabled: true,
      0: { visible: true, strokeWidth: 2, deleteOnUp: false },
      1: { strokeWidth: 3 }
    }
  });



  // detect sketch
  board.on('down', function (evt) {
    // Do not sketch during dragging
    if (board.mode !== board.BOARD_MODE_NONE) {
      this.isSketching[0] = false;
    }
  });


</script>
<footer></footer>

</html>
